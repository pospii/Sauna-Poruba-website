# Po každém pushi do master nahraje změněné soubory na hosting Active24 (SFTP).
# Přihlašovací údaje jsou v GitHub Secrets: FTP_USERNAME, FTP_PASSWORD.
name: Deploy na Active24

on:
  push:
    branches: [master]
  workflow_dispatch: # ruční spuštění z karty Actions

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # celá historie kvůli porovnání s posledním nasazením

      - name: Instalace lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Nahrání přes SFTP
        env:
          SFTP_HOST: saunarelaxbar.cz
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: saunarelaxbar.cz/web
        run: bash .github/deploy.sh
